spring.application.name=labmcp

spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC

spring.ai.mcp.server.protocol=streamable

spring.ai.mcp.server.stdio=false

server.port=8088

logging.file.name=./logs/labmcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=INFO

spring.datasource.url=jdbc:mysql://localhost:3306/supermercado_mcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.sql.init.mode=never

app.demo.client-id=1
